[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-agent"
version = "0.1.0"
description = "Compare files and tables, generate negative tests, and check ETL loads."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
